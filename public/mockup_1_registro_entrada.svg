<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#0b0f17; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="1440" height="70" fill="#ffffff" filter="url(#shadow1)"/>
  <text x="40" y="42" font-size="14" fill="#64748b" font-weight="500">Workspace <tspan fill="#0f172a" font-weight="700"> &gt; Operaciones &gt; Registro de Entrada</tspan></text>
  
  <circle cx="1080" cy="35" r="5" fill="#10b981"/>
  <text x="1095" y="39" font-size="13" fill="#047857" font-weight="600">Sistema en línea</text>

  <rect x="1220" y="16" width="180" height="38" rx="19" fill="#f1f5f9"/>
  <circle cx="1240" cy="35" r="14" fill="#0f172a"/>
  <text x="1233" y="40" font-size="12" fill="#ffffff" font-weight="700">CM</text>
  <text x="1262" y="32" font-size="12" fill="#0f172a" font-weight="700">Camila Martínez</text>
  <text x="1262" y="45" font-size="11" fill="#64748b">Operadora Caseta</text>

  <!-- Left Sidebar -->
  <rect x="0" y="70" width="240" height="830" fill="#0f172a"/>
  
  <!-- Logo -->
  <rect x="24" y="94" width="36" height="36" rx="8" fill="#10b981"/>
  <text x="36" y="118" font-size="18" fill="#ffffff" font-weight="900">P</text>
  <text x="70" y="110" font-size="14" fill="#ffffff" font-weight="800">Autos Colombia</text>
  <text x="70" y="124" font-size="11" fill="#94a3b8">Sede Chapinero · Bogotá</text>

  <!-- Navigation items -->
  <g transform="translate(16, 160)">
    <rect x="0" y="0" width="208" height="42" rx="8" fill="#10b981" fill-opacity="0.15"/>
    <rect x="0" y="6" width="4" height="30" rx="2" fill="#10b981"/>
    <text x="36" y="26" font-size="13" fill="#34d399" font-weight="700">1. Registro Entrada</text>

    <text x="36" y="68" font-size="13" fill="#94a3b8" font-weight="500">2. Ticket Ingreso</text>
    <text x="36" y="110" font-size="13" fill="#94a3b8" font-weight="500">3. Vehículos Activos</text>
    <text x="36" y="152" font-size="13" fill="#94a3b8" font-weight="500">4. Salida y Cobro</text>
    <text x="36" y="194" font-size="13" fill="#94a3b8" font-weight="500">5. Recibo de Caja</text>
    <text x="36" y="236" font-size="13" fill="#94a3b8" font-weight="500">Celdas y Aforo</text>
    <text x="36" y="278" font-size="13" fill="#94a3b8" font-weight="500">Mensualistas</text>
    <text x="36" y="320" font-size="13" fill="#94a3b8" font-weight="500">Novedades</text>
  </g>

  <!-- Main Canvas Area -->
  <g transform="translate(280, 100)">
    <text x="0" y="30" font-size="24" fill="#ffffff" font-weight="800">1. Registro de Entrada de Vehículos</text>
    <text x="0" y="52" font-size="14" fill="#94a3b8">Captura de placa RUNT, verificación de mensualista, asignación de celda e inspección física inicial</text>

    <!-- Main Card Container -->
    <rect x="0" y="75" width="720" height="680" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <!-- Step 1: Placa Input -->
    <g transform="translate(30, 105)">
      <text x="0" y="20" font-size="13" fill="#94a3b8" font-weight="700" letter-spacing="1">PLACA DEL VEHÍCULO (COLOMBIA RUNT)</text>
      <rect x="0" y="32" width="440" height="64" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <text x="24" y="74" font-size="32" fill="#34d399" font-weight="900" font-family="monospace" letter-spacing="4">HNE 612</text>
      <rect x="340" y="48" width="80" height="30" rx="6" fill="#10b981" fill-opacity="0.2"/>
      <text x="350" y="68" font-size="11" fill="#34d399" font-weight="700">RUNT OK</text>
      
      <rect x="460" y="32" width="200" height="64" rx="10" fill="#0f172a" stroke="#334155"/>
      <text x="475" y="55" font-size="11" fill="#94a3b8">MODALIDAD</text>
      <text x="475" y="78" font-size="15" fill="#ffffff" font-weight="700">Usuario Rotativo</text>
    </g>

    <!-- Step 2: Tipología Vehicular -->
    <g transform="translate(30, 240)">
      <text x="0" y="20" font-size="13" fill="#94a3b8" font-weight="700" letter-spacing="1">CATEGORÍA VEHICULAR</text>
      
      <!-- Auto Selected -->
      <rect x="0" y="32" width="210" height="90" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2"/>
      <text x="18" y="62" font-size="16" fill="#ffffff" font-weight="800">Automóvil / SUV</text>
      <text x="18" y="82" font-size="12" fill="#94a3b8">Zona A · Tarifa plena</text>
      <text x="18" y="104" font-size="14" fill="#34d399" font-weight="800" font-family="monospace">$4.500 COP / hora</text>
      <circle cx="185" cy="55" r="10" fill="#10b981"/>
      <text x="181" y="60" font-size="12" fill="#ffffff" font-weight="900">✓</text>

      <!-- Moto -->
      <rect x="225" y="32" width="210" height="90" rx="10" fill="#0f172a" stroke="#334155"/>
      <text x="243" y="62" font-size="16" fill="#cbd5e1" font-weight="700">Motocicleta</text>
      <text x="243" y="82" font-size="12" fill="#64748b">Zona B · Tarifa reducida</text>
      <text x="243" y="104" font-size="14" fill="#94a3b8" font-weight="700" font-family="monospace">$2.200 COP / hora</text>

      <!-- Pesado -->
      <rect x="450" y="32" width="210" height="90" rx="10" fill="#0f172a" stroke="#334155"/>
      <text x="468" y="62" font-size="16" fill="#cbd5e1" font-weight="700">Camioneta / Pesado</text>
      <text x="468" y="82" font-size="12" fill="#64748b">Zona C · Alta capacidad</text>
      <text x="468" y="104" font-size="14" fill="#94a3b8" font-weight="700" font-family="monospace">$9.000 COP / hora</text>
    </g>

    <!-- Step 3: Celda Asignada -->
    <g transform="translate(30, 395)">
      <text x="0" y="20" font-size="13" fill="#94a3b8" font-weight="700" letter-spacing="1">ASIGNACIÓN DE CELDA (ZONA A)</text>
      
      <rect x="0" y="32" width="155" height="60" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2"/>
      <text x="16" y="58" font-size="16" fill="#34d399" font-weight="900" font-family="monospace">CELDA A-14</text>
      <text x="16" y="78" font-size="11" fill="#a7f3d0">Sugerida · Libre</text>

      <rect x="170" y="32" width="155" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="186" y="58" font-size="16" fill="#e2e8f0" font-weight="700" font-family="monospace">CELDA A-15</text>
      <text x="186" y="78" font-size="11" fill="#64748b">Disponible</text>

      <rect x="340" y="32" width="155" height="60" rx="8" fill="#0f172a" stroke="#ef4444" stroke-opacity="0.4"/>
      <text x="356" y="58" font-size="16" fill="#f87171" font-weight="700" font-family="monospace">CELDA A-16</text>
      <text x="356" y="78" font-size="11" fill="#ef4444">Ocupada</text>

      <rect x="510" y="32" width="150" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="526" y="58" font-size="16" fill="#e2e8f0" font-weight="700" font-family="monospace">CELDA A-17</text>
      <text x="526" y="78" font-size="11" fill="#64748b">Disponible</text>
    </g>

    <!-- Step 4: Inspección Física -->
    <g transform="translate(30, 520)">
      <text x="0" y="20" font-size="13" fill="#f59e0b" font-weight="700" letter-spacing="1">INSPECCIÓN FÍSICA INICIAL (LEY 1480 / SIC)</text>
      <rect x="0" y="30" width="660" height="90" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="20" y="56" font-size="12" fill="#94a3b8">Observaciones de recepción y estado de latonería:</text>
      <text x="20" y="80" font-size="13" fill="#e2e8f0" font-weight="500">"Vehículo ingresa con paquete en maletero declarado. Carrocería sin golpes recientes."</text>
      <circle cx="20" cy="102" r="5" fill="#10b981"/>
      <text x="32" y="106" font-size="11" fill="#6ee7b7">Inspección validada por operadora</text>
    </g>

    <!-- Action Button -->
    <g transform="translate(30, 680)">
      <rect x="0" y="0" width="660" height="52" rx="10" fill="#10b981"/>
      <text x="180" y="33" font-size="15" fill="#0f172a" font-weight="900" letter-spacing="1">CONFIRMAR INGRESO Y EMITIR TICKET (ENTER)</text>
    </g>

    <!-- Right Summary Card -->
    <g transform="translate(750, 75)">
      <rect x="0" y="0" width="370" height="680" rx="16" fill="#1e293b" stroke="#334155"/>
      
      <text x="25" y="40" font-size="16" fill="#ffffff" font-weight="800">Resumen de Operación</text>
      <text x="25" y="60" font-size="12" fill="#94a3b8">Validación de ingreso en tiempo real</text>
      <line x1="25" y1="80" x2="345" y2="80" stroke="#334155"/>

      <g transform="translate(25, 110)">
        <text x="0" y="0" font-size="12" fill="#94a3b8">Consecutivo a Emitir:</text>
        <text x="0" y="24" font-size="18" fill="#38bdf8" font-weight="900" font-family="monospace">PAC-2026-1042</text>

        <text x="0" y="65" font-size="12" fill="#94a3b8">Hora Exacta de Entrada:</text>
        <text x="0" y="88" font-size="16" fill="#ffffff" font-weight="700" font-family="monospace">15:30:12 COT</text>

        <text x="0" y="130" font-size="12" fill="#94a3b8">Periodo de Gracia:</text>
        <text x="0" y="152" font-size="15" fill="#34d399" font-weight="700">15 Minutos sin costo ($0)</text>

        <text x="0" y="195" font-size="12" fill="#94a3b8">Ubicación Asignada:</text>
        <text x="0" y="218" font-size="16" fill="#facc15" font-weight="800">Zona A - Celda A-14</text>
      </g>

      <!-- Security Stamp -->
      <rect x="25" y="420" width="320" height="120" rx="10" fill="#0f172a" stroke="#10b981" stroke-opacity="0.3"/>
      <text x="45" y="450" font-size="12" fill="#34d399" font-weight="800">Garantía y Responsabilidad Civil</text>
      <text x="45" y="475" font-size="11" fill="#94a3b8">Póliza Seguros Bolívar No. 44021948</text>
      <text x="45" y="495" font-size="11" fill="#94a3b8">Amparo contra hurto y daño total</text>
      <text x="45" y="520" font-size="10" fill="#64748b">Vigilado por Superintendencia de Industria y Comercio</text>

      <rect x="25" y="580" width="320" height="48" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="80" y="610" font-size="13" fill="#38bdf8" font-weight="700">Talanquera Entrada: Lista</text>
    </g>
  </g>
</svg>
