<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 960" width="1350" height="960" style="background-color: #ffffff; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="uc-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>
    <marker id="uc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
    </marker>
    <marker id="dash-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4338ca" />
    </marker>
    <marker id="extend-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309" />
    </marker>
    <marker id="gen-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,1 11,6 0,11" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    </marker>
  </defs>

  <!-- Encabezado Superior -->
  <rect x="0" y="0" width="1350" height="64" fill="#0f172a" />
  <text x="35" y="38" fill="#ffffff" font-size="18" font-weight="bold">PARQUEADERO AUTOS COLOMBIA · DIAGRAMA DE CASOS DE USO (STARUML / UML 2.5)</text>
  <text x="1000" y="38" fill="#38bdf8" font-size="12" font-weight="600">4 Actores · 16 Casos de Uso · RUP / IEEE</text>

  <!-- ================= LÍMITE DEL SISTEMA (SYSTEM BOUNDARY) ================= -->
  <rect x="230" y="80" width="880" height="800" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8,6" />
  <rect x="250" y="90" width="360" height="28" rx="6" fill="#0f172a" />
  <text x="265" y="109" fill="#ffffff" font-size="12" font-weight="bold">Sistema: Parqueadero Autos Colombia</text>

  <!-- ================= CONEXIONES (LÍNEAS DE ASOCIACIÓN / INCLUDE / EXTEND) ================= -->
  <!-- Operario -> CU-01 -->
  <line x1="160" y1="180" x2="310" y2="180" stroke="#475569" stroke-width="1.5" />
  <!-- Operario -> CU-04 -->
  <line x1="160" y1="190" x2="310" y2="340" stroke="#475569" stroke-width="1.5" />
  <!-- Operario -> CU-05 -->
  <line x1="160" y1="200" x2="310" y2="400" stroke="#475569" stroke-width="1.5" />
  <!-- Operario -> CU-06 -->
  <line x1="160" y1="210" x2="680" y2="180" stroke="#475569" stroke-width="1.5" />
  <!-- Operario -> CU-10 -->
  <line x1="160" y1="220" x2="680" y2="400" stroke="#475569" stroke-width="1.5" />

  <!-- Administrador -> CU-11, 12, 13, 14, 15, 16 -->
  <line x1="160" y1="620" x2="310" y2="560" stroke="#475569" stroke-width="1.5" />
  <line x1="160" y1="630" x2="310" y2="640" stroke="#475569" stroke-width="1.5" />
  <line x1="160" y1="640" x2="310" y2="720" stroke="#475569" stroke-width="1.5" />
  <line x1="160" y1="650" x2="310" y2="800" stroke="#475569" stroke-width="1.5" />
  <line x1="160" y1="660" x2="680" y2="600" stroke="#475569" stroke-width="1.5" />
  <line x1="160" y1="670" x2="680" y2="700" stroke="#475569" stroke-width="1.5" />

  <!-- Administrador Generaliza a Operario (Flecha hueca hacia arriba) -->
  <line x1="100" y1="560" x2="100" y2="290" stroke="#0f172a" stroke-width="2" marker-end="url(#gen-arrow)" />
  <text x="110" y="420" fill="#0f172a" font-size="10" font-weight="bold">&lt;&lt;generaliza&gt;&gt;</text>

  <!-- Cliente -> CU-01 -->
  <line x1="1180" y1="200" x2="520" y2="180" stroke="#475569" stroke-width="1.5" />
  <!-- Cliente -> CU-04 -->
  <line x1="1180" y1="210" x2="520" y2="340" stroke="#475569" stroke-width="1.5" />
  <!-- Cliente -> CU-07 -->
  <line x1="1180" y1="220" x2="890" y2="240" stroke="#475569" stroke-width="1.5" />
  <!-- Cliente -> CU-11 -->
  <line x1="1180" y1="240" x2="520" y2="560" stroke="#475569" stroke-width="1.5" />

  <!-- Pasarela Pagos / DIAN -> CU-07, CU-08 -->
  <line x1="1180" y1="680" x2="890" y2="260" stroke="#475569" stroke-width="1.5" />
  <line x1="1180" y1="690" x2="890" y2="320" stroke="#475569" stroke-width="1.5" />

  <!-- INCLUDES INTERNOS (Flechas discontinuas azules) -->
  <!-- CU-01 --<<include>>--> CU-02 -->
  <line x1="415" y1="210" x2="415" y2="250" stroke="#4338ca" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#dash-arrow)" />
  <text x="425" y="235" fill="#4338ca" font-size="9" font-weight="bold">&lt;&lt;include&gt;&gt;</text>

  <!-- CU-04 --<<include>>--> CU-06 -->
  <line x1="520" y1="340" x2="680" y2="195" stroke="#4338ca" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#dash-arrow)" />
  <text x="560" y="270" fill="#4338ca" font-size="9" font-weight="bold">&lt;&lt;include&gt;&gt;</text>

  <!-- CU-06 --<<include>>--> CU-07 -->
  <line x1="785" y1="205" x2="785" y2="235" stroke="#4338ca" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#dash-arrow)" />
  <text x="795" y="225" fill="#4338ca" font-size="9" font-weight="bold">&lt;&lt;include&gt;&gt;</text>

  <!-- CU-07 --<<include>>--> CU-08 -->
  <line x1="785" y1="285" x2="785" y2="310" stroke="#4338ca" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#dash-arrow)" />
  <text x="795" y="302" fill="#4338ca" font-size="9" font-weight="bold">&lt;&lt;include&gt;&gt;</text>

  <!-- EXTENDS (Flechas discontinuas ámbar) -->
  <!-- CU-03 --<<extend>>--> CU-01 -->
  <line x1="520" y1="150" x2="470" y2="160" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#extend-arrow)" />
  <text x="495" y="145" fill="#b45309" font-size="9" font-weight="bold">&lt;&lt;extend&gt;&gt;</text>

  <!-- CU-09 --<<extend>>--> CU-06 -->
  <line x1="900" y1="160" x2="840" y2="170" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#extend-arrow)" />
  <text x="860" y="152" fill="#b45309" font-size="9" font-weight="bold">&lt;&lt;extend&gt;&gt;</text>

  <!-- ================= PAQUETE 1: CONTROL DE ACCESO Y CELDAS ================= -->
  <rect x="250" y="130" width="370" height="340" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" />
  <text x="265" y="150" fill="#0369a1" font-size="11" font-weight="bold">Paquete 1: Control de Acceso y Celdas</text>

  <!-- CU-01 -->
  <g filter="url(#uc-shadow)">
    <ellipse cx="415" cy="180" rx="105" ry="25" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
    <text x="415" y="184" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">CU-01: Registrar Ingreso Vehicular</text>
  </g>

  <!-- CU-02 -->
  <g filter="url(#uc-shadow)">
    <ellipse cx="415" cy="275" rx="105" ry="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <text x="415" y="278" fill="#0369a1" font-size="10.5" font-weight="600" text-anchor="middle">CU-02: Asignar Celda de Parqueo</text>
  </g>

  <!-- CU-03 (Extensión daño previo) -->
  <g filter="url(#uc-shadow)">
    <ellipse cx="570" cy="150" rx="45" ry="20" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="570" y="153" fill="#92400e" font-size="9" font-weight="bold" text-anchor="middle">CU-03: Novedad</text>
  </g>

  <!-- CU-04 -->
  <g filter="url(#uc-shadow)">
    <ellipse cx="415" cy="340" rx="105" ry="24" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
    <text x="415" y="344" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">CU-04: Registrar Salida y Tiempo</text>
  </g>

  <!-- CU-05 -->
  <g filter="url(#uc-shadow)">
    <ellipse cx="415" cy="405" rx="105" ry="24" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <text x="415" y="409" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">CU-05: Monitorear Celdas en Vivo</text>
  </g>

  <!-- ================= PAQUETE 2: FACTURACIÓN Y COBRO ================= -->
  <rect x="650" y="130" width="440" height="340" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="665" y="150" fill="#15803d" font-size="11" font-weight="bold">Paquete 2: Facturación y Cobro</text>

  <!-- CU-06 -->
  <g filter="url(#uc-shadow)">
    <ellipse cx="785" cy="180" rx="105" ry="25" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
    <text x="785" y="184" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">CU-06: Liquidar Cobro Estancia</text>
  </g>

  <!-- CU-09 (Extensión tarifa preferencial) -->
  <g filter="url(#uc-shadow)">
    <ellipse cx="945" cy="160" rx="45" ry="20" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="945" y="163" fill="#92400e" font-size="8.5" font-weight="bold" text-anchor="middle">CU-09: Descuento</text>
  </g>

  <!-- CU-07 -->
  <g filter="url(#uc-shadow)">
    <ellipse cx="785" cy="260" rx="105" ry="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="785" y="264" fill="#166534" font-size="10.5" font-weight="600" text-anchor="middle">CU-07: Procesar Pago</text>
  </g>

  <!-- CU-08 -->
  <g filter="url(#uc-shadow)">
    <ellipse cx="785" cy="335" rx="105" ry="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="785" y="339" fill="#166534" font-size="10.5" font-weight="600" text-anchor="middle">CU-08: Emitir Factura / Ticket</text>
  </g>

  <!-- CU-10 -->
  <g filter="url(#uc-shadow)">
    <ellipse cx="785" cy="405" rx="105" ry="24" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
    <text x="785" y="409" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">CU-10: Cierre / Arqueo de Caja</text>
  </g>

  <!-- ================= PAQUETE 3: CLIENTES MENSUALISTAS ================= -->
  <rect x="250" y="510" width="370" height="340" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" />
  <text x="265" y="530" fill="#7e22ce" font-size="11" font-weight="bold">Paquete 3: Clientes Mensualistas y Suscripciones</text>

  <!-- CU-11 -->
  <g filter="url(#uc-shadow)">
    <ellipse cx="415" cy="560" rx="110" ry="24" fill="#ffffff" stroke="#9333ea" stroke-width="1.5" />
    <text x="415" y="564" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">CU-11: Registrar Mensualista</text>
  </g>

  <!-- CU-12 -->
  <g filter="url(#uc-shadow)">
    <ellipse cx="415" cy="640" rx="110" ry="24" fill="#ffffff" stroke="#9333ea" stroke-width="1.5" />
    <text x="415" y="644" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">CU-12: Suscribir Cupo Mensual</text>
  </g>

  <!-- CU-13 -->
  <g filter="url(#uc-shadow)">
    <ellipse cx="415" cy="720" rx="110" ry="24" fill="#ffffff" stroke="#9333ea" stroke-width="1.5" />
    <text x="415" y="724" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">CU-13: Renovar Suscripción</text>
  </g>

  <!-- CU-14 -->
  <g filter="url(#uc-shadow)">
    <ellipse cx="415" cy="800" rx="110" ry="24" fill="#ffffff" stroke="#9333ea" stroke-width="1.5" />
    <text x="415" y="804" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">CU-14: Consultar Estado Cuenta</text>
  </g>

  <!-- ================= PAQUETE 4: CONFIGURACIÓN Y AUDITORÍA ================= -->
  <rect x="650" y="510" width="440" height="340" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" />
  <text x="665" y="530" fill="#be123c" font-size="11" font-weight="bold">Paquete 4: Administración y Parámetros</text>

  <!-- CU-15 -->
  <g filter="url(#uc-shadow)">
    <ellipse cx="785" cy="600" rx="115" ry="25" fill="#ffffff" stroke="#e11d48" stroke-width="1.5" />
    <text x="785" y="604" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">CU-15: Configurar Tarifas</text>
  </g>

  <!-- CU-16 -->
  <g filter="url(#uc-shadow)">
    <ellipse cx="785" cy="700" rx="115" ry="25" fill="#ffffff" stroke="#e11d48" stroke-width="1.5" />
    <text x="785" y="704" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">CU-16: Reportes de Ocupación</text>
  </g>

  <!-- ================= ACTORES (FIGURAS DE PALITOS / ICONOS UML) ================= -->
  <!-- 1. OPERARIO DE CASETA -->
  <g transform="translate(60, 140)">
    <!-- Cabeza -->
    <circle cx="40" cy="20" r="14" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" />
    <!-- Cuerpo -->
    <line x1="40" y1="34" x2="40" y2="70" stroke="#0284c7" stroke-width="2.5" />
    <!-- Brazos -->
    <line x1="15" y1="48" x2="65" y2="48" stroke="#0284c7" stroke-width="2.5" />
    <!-- Piernas -->
    <line x1="40" y1="70" x2="20" y2="100" stroke="#0284c7" stroke-width="2.5" />
    <line x1="40" y1="70" x2="60" y2="100" stroke="#0284c7" stroke-width="2.5" />
    <!-- Nombre -->
    <text x="40" y="120" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">Operario / Cajero</text>
    <text x="40" y="134" fill="#64748b" font-size="10" text-anchor="middle">(Actor Principal)</text>
  </g>

  <!-- 2. ADMINISTRADOR DEL PARQUEADERO -->
  <g transform="translate(60, 580)">
    <!-- Cabeza -->
    <circle cx="40" cy="20" r="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5" />
    <!-- Corona/Supervisor badge -->
    <polygon points="32,7 40,2 48,7 45,10 35,10" fill="#f59e0b" />
    <!-- Cuerpo -->
    <line x1="40" y1="34" x2="40" y2="70" stroke="#4f46e5" stroke-width="2.5" />
    <!-- Brazos -->
    <line x1="15" y1="48" x2="65" y2="48" stroke="#4f46e5" stroke-width="2.5" />
    <!-- Piernas -->
    <line x1="40" y1="70" x2="20" y2="100" stroke="#4f46e5" stroke-width="2.5" />
    <line x1="40" y1="70" x2="60" y2="100" stroke="#4f46e5" stroke-width="2.5" />
    <!-- Nombre -->
    <text x="40" y="120" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">Administrador</text>
    <text x="40" y="134" fill="#64748b" font-size="10" text-anchor="middle">(Supervisor)</text>
  </g>

  <!-- 3. CLIENTE CONDUCTOR / MENSUALISTA -->
  <g transform="translate(1180, 160)">
    <!-- Cabeza -->
    <circle cx="40" cy="20" r="14" fill="#ffffff" stroke="#059669" stroke-width="2.5" />
    <!-- Cuerpo -->
    <line x1="40" y1="34" x2="40" y2="70" stroke="#059669" stroke-width="2.5" />
    <!-- Brazos -->
    <line x1="15" y1="48" x2="65" y2="48" stroke="#059669" stroke-width="2.5" />
    <!-- Piernas -->
    <line x1="40" y1="70" x2="20" y2="100" stroke="#059669" stroke-width="2.5" />
    <line x1="40" y1="70" x2="60" y2="100" stroke="#059669" stroke-width="2.5" />
    <!-- Nombre -->
    <text x="40" y="120" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">Cliente Conductor</text>
    <text x="40" y="134" fill="#64748b" font-size="10" text-anchor="middle">(Mensualista)</text>
  </g>

  <!-- 4. PASARELA PAGOS / DIAN (Actor Sistema) -->
  <g transform="translate(1180, 640)">
    <rect x="5" y="10" width="70" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <line x1="15" y1="25" x2="65" y2="25" stroke="#d97706" stroke-width="2" />
    <circle cx="20" cy="42" r="3" fill="#d97706" />
    <circle cx="32" cy="42" r="3" fill="#d97706" />
    <text x="40" y="76" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">Pasarela Pagos</text>
    <text x="40" y="90" fill="#64748b" font-size="10" text-anchor="middle">Facturación DIAN</text>
    <text x="40" y="104" fill="#b45309" font-size="9" font-style="italic" text-anchor="middle">&lt;&lt;sistema externo&gt;&gt;</text>
  </g>

  <!-- ================= LEYENDA INFERIOR ================= -->
  <rect x="35" y="900" width="1280" height="45" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  
  <ellipse cx="60" cy="922" rx="16" ry="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
  <text x="85" y="926" fill="#334155" font-size="11" font-weight="600">Caso de Uso (Oval)</text>

  <line x1="230" y1="922" x2="270" y2="922" stroke="#475569" stroke-width="1.5" />
  <text x="280" y="926" fill="#334155" font-size="11" font-weight="600">Asociación Directa</text>

  <line x1="420" y1="922" x2="460" y2="922" stroke="#4338ca" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#dash-arrow)" />
  <text x="470" y="926" fill="#4338ca" font-size="11" font-weight="bold">&lt;&lt;include&gt;&gt; Inclusión Requerida</text>

  <line x1="680" y1="922" x2="720" y2="922" stroke="#b45309" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#extend-arrow)" />
  <text x="730" y="926" fill="#b45309" font-size="11" font-weight="bold">&lt;&lt;extend&gt;&gt; Extensión Condicional</text>

  <line x1="940" y1="922" x2="980" y2="922" stroke="#0f172a" stroke-width="1.8" marker-end="url(#gen-arrow)" />
  <text x="990" y="926" fill="#0f172a" font-size="11" font-weight="bold">Generalización de Actores</text>
</svg>
