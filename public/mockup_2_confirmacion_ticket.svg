<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#0b0f17; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="1440" height="70" fill="#ffffff" filter="url(#shadow2)"/>
  <text x="40" y="42" font-size="14" fill="#64748b" font-weight="500">Workspace <tspan fill="#0f172a" font-weight="700"> &gt; Operaciones &gt; Confirmación y Ticket Térmico</tspan></text>
  
  <circle cx="1080" cy="35" r="5" fill="#10b981"/>
  <text x="1095" y="39" font-size="13" fill="#047857" font-weight="600">Impresora Térmica Conectada (80mm)</text>

  <rect x="1220" y="16" width="180" height="38" rx="19" fill="#f1f5f9"/>
  <circle cx="1240" cy="35" r="14" fill="#0f172a"/>
  <text x="1233" y="40" font-size="12" fill="#ffffff" font-weight="700">CM</text>
  <text x="1262" y="32" font-size="12" fill="#0f172a" font-weight="700">Camila Martínez</text>
  <text x="1262" y="45" font-size="11" fill="#64748b">Operadora Caseta</text>

  <!-- Left Sidebar -->
  <rect x="0" y="70" width="240" height="830" fill="#0f172a"/>
  <rect x="24" y="94" width="36" height="36" rx="8" fill="#10b981"/>
  <text x="36" y="118" font-size="18" fill="#ffffff" font-weight="900">P</text>
  <text x="70" y="110" font-size="14" fill="#ffffff" font-weight="800">Autos Colombia</text>
  <text x="70" y="124" font-size="11" fill="#94a3b8">Sede Chapinero · Bogotá</text>

  <g transform="translate(16, 160)">
    <text x="36" y="26" font-size="13" fill="#94a3b8" font-weight="500">1. Registro Entrada</text>
    <rect x="0" y="42" width="208" height="42" rx="8" fill="#10b981" fill-opacity="0.15"/>
    <rect x="0" y="48" width="4" height="30" rx="2" fill="#10b981"/>
    <text x="36" y="68" font-size="13" fill="#34d399" font-weight="700">2. Ticket Ingreso</text>
    <text x="36" y="110" font-size="13" fill="#94a3b8" font-weight="500">3. Vehículos Activos</text>
    <text x="36" y="152" font-size="13" fill="#94a3b8" font-weight="500">4. Salida y Cobro</text>
    <text x="36" y="194" font-size="13" fill="#94a3b8" font-weight="500">5. Recibo de Caja</text>
  </g>

  <!-- Main Canvas Area -->
  <g transform="translate(280, 100)">
    <text x="0" y="30" font-size="24" fill="#ffffff" font-weight="800">2. Confirmación de Ingreso y Ticket Térmico</text>
    <text x="0" y="52" font-size="14" fill="#94a3b8">Comprobante físico y digital con código QR de alta densidad y validación Ley 1480 de 2011</text>

    <!-- Simulated ESC/POS 80mm Receipt -->
    <g transform="translate(60, 85)" filter="url(#shadow2)">
      <!-- Paper Background -->
      <path d="M 0 0 L 380 0 L 380 620 L 360 610 L 340 620 L 320 610 L 300 620 L 280 610 L 260 620 L 240 610 L 220 620 L 200 610 L 180 620 L 160 610 L 140 620 L 120 610 L 100 620 L 80 610 L 60 620 L 40 610 L 20 620 L 0 610 Z" fill="#ffffff"/>
      <rect x="0" y="0" width="380" height="8" fill="#10b981"/>

      <!-- Header Content -->
      <text x="190" y="36" font-size="17" fill="#0f172a" font-weight="900" text-anchor="middle">PARQUEADERO AUTOS COLOMBIA</text>
      <text x="190" y="54" font-size="12" fill="#475569" text-anchor="middle">Autos Colombia S.A.S. · NIT: 900.842.125-4</text>
      <text x="190" y="70" font-size="11" fill="#64748b" text-anchor="middle">Calle 50 # 45-20 · Chapinero, Bogotá D.C.</text>
      <text x="190" y="85" font-size="11" fill="#64748b" text-anchor="middle">PBX: (601) 320-8900 · Régimen Común</text>
      
      <line x1="25" y1="100" x2="355" y2="100" stroke="#cbd5e1" stroke-dasharray="4 4"/>

      <!-- Consecutivo -->
      <rect x="35" y="112" width="310" height="38" rx="6" fill="#f1f5f9"/>
      <text x="190" y="136" font-size="15" fill="#0f172a" font-weight="900" font-family="monospace" text-anchor="middle">TIQUETE: PAC-2026-1042</text>

      <!-- Placa Hero -->
      <text x="40" y="180" font-size="12" fill="#64748b" font-weight="700">PLACA DEL VEHÍCULO:</text>
      <rect x="35" y="190" width="310" height="52" rx="8" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
      <text x="190" y="227" font-size="30" fill="#0f172a" font-weight="900" font-family="monospace" text-anchor="middle" letter-spacing="4">HNE 612</text>

      <!-- Entry Data Grid -->
      <g transform="translate(35, 265)">
        <text x="0" y="0" font-size="12" fill="#64748b">CATEGORÍA:</text>
        <text x="310" y="0" font-size="12" fill="#0f172a" font-weight="800" text-anchor="end">Automóvil Particular</text>

        <text x="0" y="24" font-size="12" fill="#64748b">CELDA ASIGNADA:</text>
        <text x="310" y="24" font-size="13" fill="#059669" font-weight="900" text-anchor="end">A-14 (Pabellón A)</text>

        <text x="0" y="48" font-size="12" fill="#64748b">FECHA INGRESO:</text>
        <text x="310" y="48" font-size="12" fill="#0f172a" font-weight="700" font-family="monospace" text-anchor="end">23/10/2026</text>

        <text x="0" y="72" font-size="12" fill="#64748b">HORA EXACTA:</text>
        <text x="310" y="72" font-size="13" fill="#0f172a" font-weight="900" font-family="monospace" text-anchor="end">15:30:12 COT</text>

        <text x="0" y="96" font-size="12" fill="#64748b">TARIFA POR HORA:</text>
        <text x="310" y="96" font-size="13" fill="#0f172a" font-weight="800" text-anchor="end">$4.500 COP</text>
      </g>

      <!-- QR Code Block -->
      <line x1="25" y1="385" x2="355" y2="385" stroke="#cbd5e1" stroke-dasharray="4 4"/>
      <rect x="135" y="400" width="110" height="110" rx="8" fill="#0f172a"/>
      <!-- Inner QR matrix simulation -->
      <rect x="145" y="410" width="30" height="30" fill="#ffffff"/>
      <rect x="150" y="415" width="20" height="20" fill="#0f172a"/>
      <rect x="205" y="410" width="30" height="30" fill="#ffffff"/>
      <rect x="210" y="415" width="20" height="20" fill="#0f172a"/>
      <rect x="145" y="470" width="30" height="30" fill="#ffffff"/>
      <rect x="150" y="475" width="20" height="20" fill="#0f172a"/>
      <rect x="185" y="445" width="10" height="10" fill="#ffffff"/>
      <rect x="200" y="460" width="15" height="15" fill="#ffffff"/>

      <text x="190" y="530" font-size="11" fill="#475569" font-weight="600" text-anchor="middle">Escanee en salida para validación exprés</text>

      <!-- Legal footer -->
      <text x="190" y="555" font-size="8.5" fill="#94a3b8" text-anchor="middle">Contrato de depósito mercantil · Ley 1480 de 2011</text>
      <text x="190" y="570" font-size="8.5" fill="#94a3b8" text-anchor="middle">Periodo de gracia: 15 minutos sin costo</text>
      <text x="190" y="585" font-size="8" fill="#94a3b8" text-anchor="middle">Póliza Seguros Bolívar No. 44021948 · No deje objetos de valor</text>
    </g>

    <!-- Side Actions and Instructions -->
    <g transform="translate(520, 85)">
      <rect x="0" y="0" width="580" height="620" rx="16" fill="#1e293b" stroke="#334155"/>
      <text x="35" y="45" font-size="18" fill="#ffffff" font-weight="800">Estado de Operación: ÉXITO</text>
      <text x="35" y="70" font-size="13" fill="#34d399">✓ Talanquera de Acceso Norte Abierta para HNE-612</text>
      <line x1="35" y1="95" x2="545" y2="95" stroke="#334155"/>

      <!-- Big buttons -->
      <g transform="translate(35, 120)">
        <rect x="0" y="0" width="510" height="54" rx="10" fill="#10b981"/>
        <text x="140" y="34" font-size="15" fill="#0f172a" font-weight="900">IMPRIMIR TICKET TÉRMICO (Ctrl + P)</text>

        <rect x="0" y="70" width="245" height="50" rx="10" fill="#0f172a" stroke="#334155"/>
        <text x="45" y="101" font-size="13" fill="#ffffff" font-weight="700">Enviar por WhatsApp</text>

        <rect x="265" y="70" width="245" height="50" rx="10" fill="#0f172a" stroke="#334155"/>
        <text x="315" y="101" font-size="13" fill="#ffffff" font-weight="700">Enviar por Correo</text>
      </g>

      <!-- Checklist of fulfilled rules -->
      <g transform="translate(35, 290)">
        <text x="0" y="0" font-size="14" fill="#ffffff" font-weight="800">Reglas de Negocio Validadas:</text>

        <g transform="translate(0, 20)">
          <circle cx="10" cy="10" r="8" fill="#10b981"/>
          <text x="7" y="14" font-size="11" fill="#0f172a" font-weight="900">✓</text>
          <text x="28" y="14" font-size="13" fill="#cbd5e1"><tspan font-weight="700" fill="#34d399">RN-01:</tspan> Validación sintáctica RUNT superada con éxito.</text>
        </g>

        <g transform="translate(0, 50)">
          <circle cx="10" cy="10" r="8" fill="#10b981"/>
          <text x="7" y="14" font-size="11" fill="#0f172a" font-weight="900">✓</text>
          <text x="28" y="14" font-size="13" fill="#cbd5e1"><tspan font-weight="700" fill="#34d399">RN-03:</tspan> Celda A-14 conmutada a estado OCUPADA.</text>
        </g>

        <g transform="translate(0, 80)">
          <circle cx="10" cy="10" r="8" fill="#10b981"/>
          <text x="7" y="14" font-size="11" fill="#0f172a" font-weight="900">✓</text>
          <text x="28" y="14" font-size="13" fill="#cbd5e1"><tspan font-weight="700" fill="#34d399">RN-04:</tspan> Consecutivo PAC-2026-1042 emitido e inmutable.</text>
        </g>

        <g transform="translate(0, 110)">
          <circle cx="10" cy="10" r="8" fill="#10b981"/>
          <text x="7" y="14" font-size="11" fill="#0f172a" font-weight="900">✓</text>
          <text x="28" y="14" font-size="13" fill="#cbd5e1"><tspan font-weight="700" fill="#34d399">RN-05:</tspan> Talanquera automática abierta durante 20 segundos.</text>
        </g>
      </g>

      <!-- Next action -->
      <rect x="35" y="520" width="510" height="50" rx="10" fill="#3b82f6"/>
      <text x="175" y="552" font-size="14" fill="#ffffff" font-weight="900">REGISTRAR NUEVO INGRESO (ESC)</text>
    </g>
  </g>
</svg>
