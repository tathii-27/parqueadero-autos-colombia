<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#0b0f17; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="1440" height="70" fill="#ffffff" filter="url(#shadow5)"/>
  <text x="40" y="42" font-size="14" fill="#64748b" font-weight="500">Workspace <tspan fill="#0f172a" font-weight="700"> &gt; Taquilla &gt; Confirmación de Salida y Recibo Fiscal</tspan></text>
  
  <circle cx="1080" cy="35" r="5" fill="#10b981"/>
  <text x="1095" y="39" font-size="13" fill="#047857" font-weight="600">Transacción Asentada en Contabilidad</text>

  <rect x="1220" y="16" width="180" height="38" rx="19" fill="#f1f5f9"/>
  <circle cx="1240" cy="35" r="14" fill="#0f172a"/>
  <text x="1233" y="40" font-size="12" fill="#ffffff" font-weight="700">DR</text>
  <text x="1262" y="32" font-size="12" fill="#0f172a" font-weight="700">Diana Restrepo</text>
  <text x="1262" y="45" font-size="11" fill="#64748b">Cajera Principal</text>

  <!-- Left Sidebar -->
  <rect x="0" y="70" width="240" height="830" fill="#0f172a"/>
  <rect x="24" y="94" width="36" height="36" rx="8" fill="#10b981"/>
  <text x="36" y="118" font-size="18" fill="#ffffff" font-weight="900">P</text>
  <text x="70" y="110" font-size="14" fill="#ffffff" font-weight="800">Autos Colombia</text>
  <text x="70" y="124" font-size="11" fill="#94a3b8">Sede Chapinero · Bogotá</text>

  <g transform="translate(16, 160)">
    <text x="36" y="26" font-size="13" fill="#94a3b8" font-weight="500">1. Registro Entrada</text>
    <text x="36" y="68" font-size="13" fill="#94a3b8" font-weight="500">2. Ticket Ingreso</text>
    <text x="36" y="110" font-size="13" fill="#94a3b8" font-weight="500">3. Vehículos Activos</text>
    <text x="36" y="152" font-size="13" fill="#94a3b8" font-weight="500">4. Salida y Cobro</text>
    <rect x="0" y="168" width="208" height="42" rx="8" fill="#10b981" fill-opacity="0.15"/>
    <rect x="0" y="174" width="4" height="30" rx="2" fill="#10b981"/>
    <text x="36" y="194" font-size="13" fill="#34d399" font-weight="700">5. Recibo de Caja</text>
  </g>

  <!-- Main Canvas Area -->
  <g transform="translate(280, 100)">
    <text x="0" y="30" font-size="24" fill="#ffffff" font-weight="800">5. Confirmación de Salida y Recibo Fiscal de Caja</text>
    <text x="0" y="52" font-size="14" fill="#94a3b8">Liberación reactiva de celda en base de datos, apertura de talanquera y recibo de caja consecutivo</text>

    <!-- Left: Barrier Status & Operations Release -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="670" height="640" rx="16" fill="#1e293b" stroke="#334155"/>

      <!-- Big Success Banner -->
      <g transform="translate(30, 30)">
        <rect x="0" y="0" width="610" height="130" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2"/>
        <circle cx="45" cy="45" r="24" fill="#10b981"/>
        <text x="36" y="53" font-size="24" fill="#0f172a" font-weight="900">✓</text>
        <text x="85" y="42" font-size="20" fill="#ffffff" font-weight="900">¡SALIDA EXITOSA Y REGISTRADA!</text>
        <text x="85" y="66" font-size="14" fill="#34d399" font-weight="700">Talanquera de Salida Sur abierta automáticamente</text>
        <text x="85" y="94" font-size="13" fill="#cbd5e1">El vehículo <tspan fill="#facc15" font-weight="900" font-family="monospace">HNE 612</tspan> ha sido retirado formalmente del patio de estacionamiento.</text>
      </g>

      <!-- Cell Release Status -->
      <g transform="translate(30, 185)">
        <text x="0" y="0" font-size="14" fill="#ffffff" font-weight="800">Actualización Inmediata en Base de Datos:</text>
        
        <rect x="0" y="16" width="295" height="110" rx="10" fill="#0f172a" stroke="#10b981"/>
        <text x="20" y="44" font-size="12" fill="#94a3b8">ESTADO DE CELDA A-14:</text>
        <text x="20" y="78" font-size="22" fill="#34d399" font-weight="900">DISPONIBLE</text>
        <text x="20" y="102" font-size="11" fill="#6ee7b7">✓ Lista para nuevo vehículo</text>

        <rect x="315" y="16" width="295" height="110" rx="10" fill="#0f172a" stroke="#38bdf8"/>
        <text x="335" y="44" font-size="12" fill="#94a3b8">NUEVO AFORO GENERAL:</text>
        <text x="335" y="78" font-size="22" fill="#38bdf8" font-weight="900">155 Plazas Libres</text>
        <text x="335" y="102" font-size="11" fill="#7dd3fc">60.8% de capacidad del parqueadero</text>
      </g>

      <!-- Security & Legal Checklist -->
      <g transform="translate(30, 335)">
        <text x="0" y="0" font-size="14" fill="#ffffff" font-weight="800">Garantías Legales Aplicadas (Ley 1480 / DIAN):</text>

        <g transform="translate(0, 18)">
          <circle cx="10" cy="10" r="8" fill="#10b981"/>
          <text x="7" y="14" font-size="11" fill="#0f172a" font-weight="900">✓</text>
          <text x="28" y="14" font-size="13" fill="#cbd5e1">Asentamiento atómico del recaudo ($13.500 COP) en libro de caja.</text>
        </g>
        <g transform="translate(0, 48)">
          <circle cx="10" cy="10" r="8" fill="#10b981"/>
          <text x="7" y="14" font-size="11" fill="#0f172a" font-weight="900">✓</text>
          <text x="28" y="14" font-size="13" fill="#cbd5e1">Finiquito de la custodia y responsabilidad civil sobre el automotor.</text>
        </g>
        <g transform="translate(0, 78)">
          <circle cx="10" cy="10" r="8" fill="#10b981"/>
          <text x="7" y="14" font-size="11" fill="#0f172a" font-weight="900">✓</text>
          <text x="28" y="14" font-size="13" fill="#cbd5e1">Generación de documento fiscal equivalente soporte de ingresos.</text>
        </g>
      </g>

      <!-- Action Buttons -->
      <g transform="translate(30, 470)">
        <rect x="0" y="0" width="295" height="52" rx="10" fill="#10b981"/>
        <text x="50" y="32" font-size="13" fill="#0f172a" font-weight="900">IMPRIMIR RECIBO (ENTER)</text>

        <rect x="315" y="0" width="295" height="52" rx="10" fill="#0f172a" stroke="#334155"/>
        <text x="365" y="32" font-size="13" fill="#ffffff" font-weight="700">Enviar Recibo por Email</text>

        <rect x="0" y="65" width="610" height="50" rx="10" fill="#3b82f6"/>
        <text x="200" y="97" font-size="14" fill="#ffffff" font-weight="900">NUEVA OPERACIÓN DE SALIDA (ESC)</text>
      </g>
    </g>

    <!-- Right: Simulated Official Fiscal Receipt -->
    <g transform="translate(710, 85)" filter="url(#shadow5)">
      <path d="M 0 0 L 390 0 L 390 640 L 370 630 L 350 640 L 330 630 L 310 640 L 290 630 L 270 640 L 250 630 L 230 640 L 210 630 L 190 640 L 170 630 L 150 640 L 130 630 L 110 640 L 90 630 L 70 640 L 50 630 L 30 640 L 10 630 L 0 640 Z" fill="#ffffff"/>
      <rect x="0" y="0" width="390" height="8" fill="#0f172a"/>

      <!-- Header -->
      <text x="195" y="36" font-size="17" fill="#0f172a" font-weight="900" text-anchor="middle">AUTOS COLOMBIA S.A.S.</text>
      <text x="195" y="54" font-size="12" fill="#475569" text-anchor="middle">NIT: 900.842.125-4 · Régimen Común</text>
      <text x="195" y="70" font-size="11" fill="#64748b" text-anchor="middle">Calle 50 # 45-20 · Chapinero, Bogotá D.C.</text>

      <line x1="25" y1="85" x2="365" y2="85" stroke="#cbd5e1" stroke-dasharray="4 4"/>

      <!-- Receipt badge -->
      <rect x="35" y="98" width="320" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="195" y="116" font-size="11" fill="#64748b" text-anchor="middle">RECIBO OFICIAL DE CAJA</text>
      <text x="195" y="133" font-size="15" fill="#0f172a" font-weight="900" font-family="monospace" text-anchor="middle">No. REC-008920</text>

      <!-- Details -->
      <g transform="translate(35, 160)">
        <text x="0" y="0" font-size="12" fill="#64748b">FECHA Y HORA:</text>
        <text x="320" y="0" font-size="12" fill="#0f172a" font-weight="700" font-family="monospace" text-anchor="end">23/10/2026 16:22:15</text>

        <text x="0" y="24" font-size="12" fill="#64748b">PLACA AUTOMOTOR:</text>
        <text x="320" y="24" font-size="14" fill="#0f172a" font-weight="900" font-family="monospace" text-anchor="end">HNE 612</text>

        <text x="0" y="48" font-size="12" fill="#64748b">TIQUETE ASOCIADO:</text>
        <text x="320" y="48" font-size="12" fill="#0f172a" font-family="monospace" text-anchor="end">PAC-2026-1042</text>

        <text x="0" y="72" font-size="12" fill="#64748b">TIEMPO FACTURADO:</text>
        <text x="320" y="72" font-size="12" fill="#0f172a" font-weight="700" text-anchor="end">3 horas (2h 17m reales)</text>

        <text x="0" y="96" font-size="12" fill="#64748b">MEDIO DE PAGO:</text>
        <text x="320" y="96" font-size="12" fill="#059669" font-weight="800" text-anchor="end">Efectivo en Caja</text>

        <text x="0" y="120" font-size="12" fill="#64748b">CAJERO EN TURNO:</text>
        <text x="320" y="120" font-size="12" fill="#0f172a" text-anchor="end">Diana Restrepo (Caja 01)</text>
      </g>

      <!-- Tax Breakdown -->
      <line x1="25" y1="305" x2="365" y2="305" stroke="#cbd5e1" stroke-dasharray="4 4"/>
      <g transform="translate(35, 330)">
        <text x="0" y="0" font-size="12" fill="#64748b">SUBTOTAL BASE GRAVABLE:</text>
        <text x="320" y="0" font-size="12" fill="#0f172a" font-family="monospace" text-anchor="end">$11.345 COP</text>

        <text x="0" y="24" font-size="12" fill="#64748b">IVA REGULADO (19%):</text>
        <text x="320" y="24" font-size="12" fill="#0f172a" font-family="monospace" text-anchor="end">$2.155 COP</text>

        <line x1="0" y1="38" x2="320" y2="38" stroke="#0f172a" stroke-width="1.5"/>

        <text x="0" y="62" font-size="15" fill="#0f172a" font-weight="900">TOTAL PAGADO:</text>
        <text x="320" y="62" font-size="20" fill="#0f172a" font-weight="900" font-family="monospace" text-anchor="end">$13.500 COP</text>

        <text x="0" y="95" font-size="12" fill="#64748b">MONTO RECIBIDO:</text>
        <text x="320" y="95" font-size="12" fill="#0f172a" font-family="monospace" text-anchor="end">$20.000 COP</text>

        <text x="0" y="118" font-size="12" fill="#059669" font-weight="800">CAMBIO ENTREGADO:</text>
        <text x="320" y="118" font-size="14" fill="#059669" font-weight="900" font-family="monospace" text-anchor="end">$6.500 COP</text>
      </g>

      <line x1="25" y1="480" x2="365" y2="480" stroke="#cbd5e1" stroke-dasharray="4 4"/>
      <text x="195" y="520" font-size="11" fill="#475569" font-weight="700" text-anchor="middle">¡GRACIAS POR PREFERIRNOS!</text>
      <text x="195" y="540" font-size="9" fill="#94a3b8" text-anchor="middle">Documento equivalente a factura de venta · Sistema POS</text>
      <text x="195" y="555" font-size="9" fill="#94a3b8" text-anchor="middle">Resolución DIAN No. 1876400012984 · Rango 1 al 50.000</text>
      <text x="195" y="575" font-size="8.5" fill="#94a3b8" text-anchor="middle">Conserve este recibo para la salida del vehículo</text>
    </g>
  </g>
</svg>
